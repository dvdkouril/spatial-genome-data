# What the workflow deploys. The PVC (setup/) is deliberately not listed,
# so `kubectl delete -k` can never remove the data.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kouril1-ns

resources:
  - cronjob.yaml
  - dataset-agent.yaml

# Where publish.sh uploads the CSV exports. Not secret; the API token is the
# r2-api Secret, created by the deploy workflow.
configMapGenerator:
  - name: r2-bucket
    literals:
      - R2_ENDPOINT=https://TODO-ACCOUNT-ID.r2.cloudflarestorage.com
      - R2_BUCKET=TODO-BUCKET
      - AWS_DEFAULT_REGION=auto

images:
  - name: cerit.io/dvdkouril/paper-agent
    newTag: latest
