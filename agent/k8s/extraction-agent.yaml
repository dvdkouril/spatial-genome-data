# The extraction agent: for dataset links the inspection agent found structures
# in, writes a marimo notebook that converts them to Arrow and opens one pull
# request per link (bin/extract.sh). Same image as the other agents; image tag
# is set by the kustomization. Suspended while we test: it only runs when
# started by hand, on one link.
# Run a pass now:  kubectl -n kouril1-ns create job --from=cronjob/extraction-agent manual-extract-1
# Follow it:       kubectl -n kouril1-ns logs -f job/manual-extract-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: extraction-agent
spec:
  suspend: true                    # no scheduled runs yet
  schedule: "30 6 * * *"           # placeholder, unused while suspended
  timeZone: Europe/Prague
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3    # keep the last finished pods, so their logs stay readable
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0              # a failed pass is not retried
      activeDeadlineSeconds: 86400 # safety net; each link also has its own time limit
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: agent
              image: cerit.io/dvdkouril/paper-agent
              args: ["extract.sh", "1"]   # one random link without an extraction yet
              env:
                - name: LLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-api
                      key: LLM_API_KEY
                - name: GITHUB_TOKEN       # only the wrapper uses it, Pi runs without it
                  valueFrom:
                    secretKeyRef:
                      name: github-token
                      key: GITHUB_TOKEN
                - name: GITHUB_REPO
                  value: dvdkouril/spatial-genome-data
                - name: LINK_TIMEOUT
                  value: 60m
              envFrom:
                - configMapRef:
                    name: r2-bucket    # R2_ENDPOINT, R2_BUCKET, AWS_DEFAULT_REGION for publish.sh
                - secretRef:
                    name: r2-api       # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (the R2 token)
              securityContext:
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                  ephemeral-storage: 5Gi
                limits:
                  cpu: "2"
                  memory: 4Gi              # room for converting a few structures
                  ephemeral-storage: 25Gi  # downloads + uv cache; the instructions say 20 GB
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: work
                  mountPath: /work
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: paper-agent-data   # reads inspections.db, writes extractions.db
            - name: work
              emptyDir:
                sizeLimit: 20Gi    # the pod is evicted if downloads go past this
