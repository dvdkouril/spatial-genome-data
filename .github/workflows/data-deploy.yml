name: Processing into cloud

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      # Download input data
      - name: Download and unzip - Stevens 2017
        run: |
          curl -L -o ./stevens-2017-input.tar.gz https://pub-5c3f8ce35c924114a178c6e929fc3ac7.r2.dev/stevens-2017-input.tar.gz
          tar -xzvf ./stevens-2017-input.tar.gz -C ./stevens-2017
          rm ./stevens-2017-input.tar.gz
      # - run: |
      #     pwd
      #     ls
      #     cd stevens-2017
      #     pwd
      #     ls

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - run: uv tool install juv
      - run: juv --help
      - name: Process files via notebook.ipynb
        run: juv exec notebook.ipynb
        working-directory: ./stevens-2017
      - run: |
          cd stevens-2017
          pwd
          ls
          cd out
          ls
      
