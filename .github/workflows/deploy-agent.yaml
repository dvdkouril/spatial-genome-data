name: Build and deploy agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "!agent/data/**"           # committing the CSV backup needs no new image
      - ".github/workflows/deploy-agent.yaml"
  workflow_dispatch:

concurrency:
  group: deploy-agent
  cancel-in-progress: false

env:
  IMAGE_NAME: cerit.io/dvdkouril/paper-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Harbor (cerit.io)
        uses: docker/login-action@v3
        with:
          registry: cerit.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_CLI_SECRET }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: agent
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      # Create the Secret, or update it if the GitHub secret changed.
      - name: Update LLM API key secret
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          kubectl create secret generic llm-api -n kouril1-ns \
            --from-literal=LLM_API_KEY="$LLM_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Only updates the CronJob; the new image is used from the next run on.
      - name: Deploy
        run: |
          cd agent/k8s
          kustomize edit set image "${IMAGE_NAME}=${IMAGE_NAME}:${GITHUB_SHA}"
          kubectl apply -k .
